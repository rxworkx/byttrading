# Optional, for a machine where another web server holds ports 80 and 443.
# Turn on with this line in .env, and delete the line to turn it off:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.behind-proxy.yml
services:
  web:
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.behind-proxy
      - --adapter
      - caddyfile
    ports: !override
      - '127.0.0.1:${WEB_PORT:-8088}:80'
